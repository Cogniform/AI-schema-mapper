[project]
name = "ai-schema-mapper"
version = "0.1.0"
description = "AI-driven ETL schema mapping and data cleaning"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "pandas>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.9",
]

[tool.uv]
# 锁文件源固定为官方 PyPI，且此处优先级高于本机 ~/AppData/Roaming/uv/uv.toml。
# 不加这一段时，本机全局 index-url 指向镜像，任何一次 `uv lock` 都会把 uv.lock
# 的 registry 整片改写成镜像源，境外 CI 拉镜像会 tcp 超时、uv sync --frozen 失败。
# 注：`default-index` 字段 uv 0.11 不认（报 unknown field 并整体忽略该节），
# 必须用下面的 [[tool.uv.index]] 表。
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
[tool.ruff]
# 不碰 Markdown 里嵌的 Python 片段：文档与笔记正文不属格式化范围
extend-exclude = ["*.md"]

[tool.ruff.lint.isort]
# config 是本地专属模块（不入库，仓库内只有 config.example.py）：
# 显式声明，避免 import 分类随文件是否存在在本地与 CI 之间漂移
known-first-party = ["config"]
